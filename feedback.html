<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback - Teachers' Day 2026</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .feedback-container {
            background: rgba(255,255,255,0.06);
            backdrop-filter: blur(12px);
            border-radius: 30px;
            padding: 40px 35px;
            max-width: 700px;
            width: 100%;
            border: 1px solid rgba(255,255,255,0.08);
            box-shadow: 0 20px 60px rgba(0,0,0,0.4);
            animation: slideUp 0.6s ease;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .feedback-container h1 {
            color: #ffd700;
            font-size: 2.2rem;
            text-align: center;
            margin-bottom: 5px;
        }

        .feedback-container .sub-heading {
            color: #a8d8ea;
            text-align: center;
            font-size: 1rem;
            margin-bottom: 25px;
            opacity: 0.8;
        }

        .feedback-container .form-group {
            margin-bottom: 20px;
        }

        .feedback-container label {
            display: block;
            color: #e0e0e0;
            font-weight: 600;
            margin-bottom: 6px;
            font-size: 0.95rem;
        }

        .feedback-container label .required {
            color: #ff6b6b;
        }

        .feedback-container label .sub-label {
            font-weight: 400;
            font-size: 0.8rem;
            color: #a8d8ea;
            opacity: 0.7;
        }

        .feedback-container input,
        .feedback-container select,
        .feedback-container textarea {
            width: 100%;
            padding: 12px 16px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.1);
            background: rgba(255,255,255,0.05);
            color: white;
            font-size: 0.95rem;
            transition: all 0.3s ease;
            outline: none;
            font-family: inherit;
        }

        .feedback-container input:focus,
        .feedback-container select:focus,
        .feedback-container textarea:focus {
            border-color: #ffd700;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.08);
            background: rgba(255,255,255,0.08);
        }

        .feedback-container input::placeholder,
        .feedback-container textarea::placeholder {
            color: rgba(255,255,255,0.3);
        }

        .feedback-container select option {
            background: #1a1a2e;
            color: white;
        }

        .feedback-container textarea {
            min-height: 100px;
            resize: vertical;
        }

        /* ===== RATING GROUP ===== */
        .feedback-container .rating-group {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 5px;
        }

        .feedback-container .rating-group label {
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: 400;
            cursor: pointer;
            padding: 6px 14px;
            border-radius: 30px;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.06);
            transition: all 0.3s ease;
            color: #a8d8ea;
            font-size: 0.9rem;
        }

        .feedback-container .rating-group label:hover {
            background: rgba(255,215,0,0.08);
            border-color: rgba(255,215,0,0.2);
        }

        .feedback-container .rating-group input[type="radio"] {
            display: none;
        }

        .feedback-container .rating-group input[type="radio"]:checked + label {
            background: rgba(255,215,0,0.15);
            border-color: #ffd700;
            color: #ffd700;
        }

        /* ===== CHECKBOX GROUP ===== */
        .feedback-container .checkbox-group {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            margin-top: 5px;
        }

        .feedback-container .checkbox-group label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 400;
            cursor: pointer;
            color: #a8d8ea;
            font-size: 0.9rem;
        }

        .feedback-container .checkbox-group input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: #ffd700;
            cursor: pointer;
        }

        /* ===== SPEED METER ===== */
        .feedback-container .speed-meter {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 5px;
        }

        .feedback-container .speed-meter label {
            display: flex;
            align-items: center;
            gap: 5px;
            font-weight: 400;
            cursor: pointer;
            padding: 6px 14px;
            border-radius: 30px;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.06);
            transition: all 0.3s ease;
            color: #a8d8ea;
            font-size: 0.85rem;
        }

        .feedback-container .speed-meter label:hover {
            background: rgba(0,210,255,0.08);
            border-color: rgba(0,210,255,0.2);
        }

        .feedback-container .speed-meter input[type="radio"] {
            display: none;
        }

        .feedback-container .speed-meter input[type="radio"]:checked + label {
            background: rgba(0,210,255,0.15);
            border-color: #00d2ff;
            color: #00d2ff;
        }

        /* ===== SUBMIT BUTTON ===== */
        .feedback-container .submit-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 30px;
            background: linear-gradient(135deg, #ffd700, #f7971e);
            color: #1a1a2e;
            font-size: 1.1rem;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 25px rgba(255, 215, 0, 0.15);
            margin-top: 5px;
        }

        .feedback-container .submit-btn:hover {
            transform: scale(1.02);
            box-shadow: 0 8px 35px rgba(255, 215, 0, 0.25);
        }

        .feedback-container .submit-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .feedback-container .back-link {
            display: block;
            text-align: center;
            margin-top: 18px;
            color: #a8d8ea;
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.3s ease;
        }

        .feedback-container .back-link:hover {
            color: #ffd700;
        }

        .feedback-container .success-msg {
            display: none;
            text-align: center;
            padding: 20px;
            background: rgba(46, 213, 115, 0.1);
            border: 1px solid #2ed573;
            border-radius: 16px;
            color: #2ed573;
            margin-top: 15px;
        }

        .feedback-container .success-msg.show {
            display: block;
        }

        .feedback-container .error-msg {
            display: none;
            text-align: center;
            padding: 15px;
            background: rgba(255,107,107,0.1);
            border: 1px solid #ff6b6b;
            border-radius: 16px;
            color: #ff6b6b;
            margin-top: 15px;
        }

        .feedback-container .error-msg.show {
            display: block;
        }

        /* ===== LOADING SPINNER ===== */
        .feedback-container .spinner {
            display: none;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,0.1);
            border-top-color: #1a1a2e;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto;
        }

        .feedback-container .spinner.show {
            display: inline-block;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 600px) {
            .feedback-container {
                padding: 25px 18px;
            }
            .feedback-container h1 {
                font-size: 1.8rem;
            }
            .feedback-container .rating-group {
                gap: 8px;
            }
            .feedback-container .rating-group label {
                font-size: 0.8rem;
                padding: 4px 12px;
            }
            .feedback-container .checkbox-group {
                gap: 10px;
            }
            .feedback-container .checkbox-group label {
                font-size: 0.8rem;
            }
            .feedback-container .speed-meter label {
                font-size: 0.75rem;
                padding: 4px 10px;
            }
        }
    </style>
</head>
<body>

    <div class="feedback-container">
        <h1>💬 Feedback</h1>
        <p class="sub-heading">Apni raay humare sath share karein! ❤️</p>

        <!-- Error Message -->
        <div class="error-msg" id="errorMsg">⚠️ Kripya saare required fields bharein!</div>

        <!-- Success Message -->
        <div class="success-msg" id="successMsg">✅ Dhanyavaad! Aapka feedback successfully submit ho gaya! ❤️</div>

        <form id="feedbackForm">
            <!-- ===== 1. NAME ===== -->
            <div class="form-group">
                <label>Your Name <span class="required">*</span></label>
                <input type="text" id="userName" placeholder="Apna naam likhein..." required>
            </div>

            <!-- ===== 2. TEACHER SELECTION ===== -->
            <div class="form-group">
                <label>Kis teacher ke liye feedback dena hai? <span class="required">*</span></label>
                <select id="teacherName" required>
                    <option value="">-- Select Teacher --</option>
                    <option value="Shyam Sir">Shyam Sir (Mr. Volcano)</option>
                    <option value="Brijesh Sir">Brijesh Sir (Sultan Sir)</option>
                    <option value="Santosh Sir">Santosh Sir (Kalidasa's Descendant)</option>
                    <option value="Kamlesh Sir">Kamlesh Sir (Maths Katha Vachak)</option>
                    <option value="Ajay Sir">Ajay Sir (Mountain Climber)</option>
                    <option value="Vishal Sir">Vishal Sir (ChatGPT ke Fufa)</option>
                    <option value="Rampravesh Sir">Rampravesh Sir (Silent Shakespeare)</option>
                    <option value="Maya Ma'am">Maya Ma'am (Art Attack Ma'am)</option>
                    <option value="Priyanka Ma'am">Priyanka Ma'am (Ma'am FM 24×7)</option>
                    <option value="Khushboo Ma'am">Khushboo Ma'am (Breaking News Ma'am)</option>
                    <option value="Seema Ma'am">Seema Ma'am (The Troubled Teacher)</option>
                    <option value="Arti Ma'am">Arti Ma'am (Skinny Legend)</option>
                    <option value="Nidhi Ma'am">Nidhi Ma'am (Zen Zenz)</option>
                    <option value="Jigyasa Miss">Jigyasa Miss (Zen-Zb)</option>
                    <option value="Ankita Ma'am">Ankita Ma'am (Busy Mode ON)</option>
                    <option value="Overall Website">Overall Website (For All Teachers)</option>
                </select>
            </div>

            <!-- ===== 3. RATING (1-5) ===== -->
            <div class="form-group">
                <label>Overall Rating <span class="required">*</span></label>
                <div class="rating-group">
                    <input type="radio" name="rating" id="star5" value="5">
                    <label for="star5">⭐ 5 - Excellent</label>
                    
                    <input type="radio" name="rating" id="star4" value="4">
                    <label for="star4">⭐ 4 - Good</label>
                    
                    <input type="radio" name="rating" id="star3" value="3">
                    <label for="star3">⭐ 3 - Average</label>
                    
                    <input type="radio" name="rating" id="star2" value="2">
                    <label for="star2">⭐ 2 - Poor</label>
                    
                    <input type="radio" name="rating" id="star1" value="1">
                    <label for="star1">⭐ 1 - Very Poor</label>
                </div>
            </div>

            <!-- ===== 4. UI/UX FEEDBACK ===== -->
            <div class="form-group">
                <label>🎨 UI/UX Feedback <span class="sub-label">(Design aur experience ke baare mein)</span></label>
                <div class="checkbox-group">
                    <label><input type="checkbox" name="uiux" value="Beautiful Design"> Beautiful Design</label>
                    <label><input type="checkbox" name="uiux" value="Easy to Use"> Easy to Use</label>
                    <label><input type="checkbox" name="uiux" value="Good Color Scheme"> Good Color Scheme</label>
                    <label><input type="checkbox" name="uiux" value="Mobile Friendly"> Mobile Friendly</label>
                    <label><input type="checkbox" name="uiux" value="Animations are Great"> Animations are Great</label>
                    <label><input type="checkbox" name="uiux" value="Needs Improvement"> Needs Improvement</label>
                </div>
            </div>

            <!-- ===== 5. SPEED FEEDBACK ===== -->
            <div class="form-group">
                <label>⚡ Website Speed <span class="sub-label">(Kitni fast load hoti hai?)</span></label>
                <div class="speed-meter">
                    <input type="radio" name="speed" id="speedFast" value="Very Fast">
                    <label for="speedFast">🚀 Very Fast</label>
                    
                    <input type="radio" name="speed" id="speedGood" value="Good">
                    <label for="speedGood">👍 Good</label>
                    
                    <input type="radio" name="speed" id="speedAvg" value="Average">
                    <label for="speedAvg">⏳ Average</label>
                    
                    <input type="radio" name="speed" id="speedSlow" value="Slow">
                    <label for="speedSlow">🐢 Slow</label>
                    
                    <input type="radio" name="speed" id="speedVSlow" value="Very Slow">
                    <label for="speedVSlow">🐌 Very Slow</label>
                </div>
            </div>

            <!-- ===== 6. MESSAGE ===== -->
            <div class="form-group">
                <label>Your Feedback / Message <span class="required">*</span></label>
                <textarea id="feedbackMsg" placeholder="Apna sandesh likhein... Kya aapko pasand aaya? Kya improve karein? ❤️" required></textarea>
            </div>

            <button type="submit" class="submit-btn" id="submitBtn">
                <span id="btnText">📤 Submit Feedback</span>
                <span class="spinner" id="btnSpinner"></span>
            </button>
        </form>

        <a href="https://ansh-buildnextt.github.io/teachers-day/" class="back-link">⬅️ Wapas Home Page par jayein</a>
    </div>

    <script>
        document.getElementById('feedbackForm').addEventListener('submit', function(e) {
            e.preventDefault();

            // Show loading
            document.getElementById('btnText').textContent = 'Submitting...';
            document.getElementById('btnSpinner').classList.add('show');
            document.getElementById('submitBtn').disabled = true;
            document.getElementById('errorMsg').classList.remove('show');
            document.getElementById('successMsg').classList.remove('show');

            // Get values
            const name = document.getElementById('userName').value.trim();
            const teacher = document.getElementById('teacherName').value;
            const rating = document.querySelector('input[name="rating"]:checked');
            const uiuxCheckboxes = document.querySelectorAll('input[name="uiux"]:checked');
            const speed = document.querySelector('input[name="speed"]:checked');
            const message = document.getElementById('feedbackMsg').value.trim();

            // Validate
            if (!name || !teacher || !rating || !message) {
                document.getElementById('errorMsg').textContent = '⚠️ Kripya saare required fields bharein!';
                document.getElementById('errorMsg').classList.add('show');
                resetButton();
                return;
            }

            // Collect UI/UX selections
            const uiuxValues = Array.from(uiuxCheckboxes).map(cb => cb.value);

            // Prepare data
            const feedbackData = {
                id: Date.now(),
                name: name,
                teacher: teacher,
                rating: rating.value,
                uiux: uiuxValues.length > 0 ? uiuxValues : ['No UI/UX feedback'],
                speed: speed ? speed.value : 'Not rated',
                message: message,
                timestamp: new Date().toLocaleString('en-IN', { 
                    timeZone: 'Asia/Kolkata',
                    day: '2-digit',
                    month: 'short',
                    year: 'numeric',
                    hour: '2-digit',
                    minute: '2-digit',
                    second: '2-digit'
                }),
                userAgent: navigator.userAgent,
                screenSize: `${window.innerWidth}x${window.innerHeight}`
            };

            // Save to localStorage
            try {
                let allFeedback = JSON.parse(localStorage.getItem('teacherFeedback') || '[]');
                allFeedback.push(feedbackData);
                localStorage.setItem('teacherFeedback', JSON.stringify(allFeedback));

                // Show success
                document.getElementById('successMsg').classList.add('show');
                document.getElementById('feedbackForm').reset();

                // Log to console
                console.log('✅ Feedback Received:', feedbackData);
                console.log('📊 Total Feedbacks:', allFeedback.length);

                // Hide success after 5 seconds
                setTimeout(() => {
                    document.getElementById('successMsg').classList.remove('show');
                }, 5000);

            } catch (error) {
                document.getElementById('errorMsg').textContent = '⚠️ Error saving feedback! Please try again.';
                document.getElementById('errorMsg').classList.add('show');
                console.error('Error:', error);
            }

            resetButton();
        });

        function resetButton() {
            document.getElementById('btnText').textContent = '📤 Submit Feedback';
            document.getElementById('btnSpinner').classList.remove('show');
            document.getElementById('submitBtn').disabled = false;
        }

        // Auto-hide error after 5 seconds
        setInterval(() => {
            document.getElementById('errorMsg').classList.remove('show');
        }, 5000);
    </script>

</body>
</html>
