<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud Storage - Build Next Technologies</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            min-height: 100vh;
            padding: 20px;
        }

        /* ===== HEADER ===== */
        .header {
            text-align: center;
            color: white;
            padding: 25px 20px 15px;
            animation: fadeIn 1s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .header .logo {
            font-size: 3.5rem;
            margin-bottom: 5px;
        }

        .header h1 {
            font-size: 2.8rem;
            font-weight: 900;
            background: linear-gradient(to right, #00d2ff, #3a7bd5, #00d2ff);
            background-size: 300% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shimmer 4s linear infinite;
            letter-spacing: 2px;
        }

        @keyframes shimmer {
            0% { background-position: 0% center; }
            100% { background-position: 300% center; }
        }

        .header .sub-title {
            color: #a8d8ea;
            font-size: 1.1rem;
            margin-top: 5px;
            -webkit-text-fill-color: #a8d8ea;
        }

        .header .dp-section {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            margin: 10px 0 5px;
            flex-wrap: wrap;
        }

        .header .dp-section .dp-img {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            border: 3px solid #00d2ff;
            object-fit: cover;
            box-shadow: 0 5px 20px rgba(0, 210, 255, 0.2);
        }

        .header .dp-section .dp-name {
            color: white;
            font-size: 0.95rem;
            font-weight: 600;
            -webkit-text-fill-color: white;
        }

        .header .stats {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-top: 12px;
            flex-wrap: wrap;
        }

        .header .stats span {
            background: rgba(255,255,255,0.06);
            padding: 6px 20px;
            border-radius: 20px;
            font-size: 0.9rem;
            color: #a8d8ea;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .header .stats span strong {
            color: #ffd700;
        }

        /* ===== SEARCH BAR ===== */
        .search-bar {
            max-width: 500px;
            margin: 15px auto 20px;
            display: flex;
            gap: 10px;
            padding: 0 10px;
        }

        .search-bar input {
            flex: 1;
            padding: 12px 20px;
            border-radius: 30px;
            border: 1px solid rgba(255,255,255,0.1);
            background: rgba(255,255,255,0.06);
            color: white;
            font-size: 0.95rem;
            outline: none;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .search-bar input::placeholder {
            color: rgba(255,255,255,0.4);
        }

        .search-bar input:focus {
            border-color: #00d2ff;
            box-shadow: 0 0 20px rgba(0, 210, 255, 0.1);
        }

        .search-bar button {
            padding: 12px 25px;
            border-radius: 30px;
            border: none;
            background: linear-gradient(135deg, #00d2ff, #3a7bd5);
            color: white;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .search-bar button:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 25px rgba(0, 210, 255, 0.3);
        }

        /* ===== GALLERY GRID ===== */
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 20px;
            max-width: 1300px;
            margin: 0 auto;
        }

        .gallery-item {
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(12px);
            border-radius: 18px;
            padding: 14px;
            border: 1px solid rgba(255,255,255,0.06);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            text-align: center;
            animation: slideUp 0.5s ease forwards;
            opacity: 0;
            cursor: pointer;
        }

        .gallery-item:nth-child(1) { animation-delay: 0.03s; }
        .gallery-item:nth-child(2) { animation-delay: 0.06s; }
        .gallery-item:nth-child(3) { animation-delay: 0.09s; }
        .gallery-item:nth-child(4) { animation-delay: 0.12s; }
        .gallery-item:nth-child(5) { animation-delay: 0.15s; }
        .gallery-item:nth-child(6) { animation-delay: 0.18s; }
        .gallery-item:nth-child(7) { animation-delay: 0.21s; }
        .gallery-item:nth-child(8) { animation-delay: 0.24s; }
        .gallery-item:nth-child(9) { animation-delay: 0.27s; }
        .gallery-item:nth-child(10) { animation-delay: 0.30s; }
        .gallery-item:nth-child(11) { animation-delay: 0.33s; }
        .gallery-item:nth-child(12) { animation-delay: 0.36s; }
        .gallery-item:nth-child(13) { animation-delay: 0.39s; }
        .gallery-item:nth-child(14) { animation-delay: 0.42s; }
        .gallery-item:nth-child(15) { animation-delay: 0.45s; }
        .gallery-item:nth-child(16) { animation-delay: 0.48s; }
        .gallery-item:nth-child(17) { animation-delay: 0.51s; }
        .gallery-item:nth-child(18) { animation-delay: 0.54s; }
        .gallery-item:nth-child(19) { animation-delay: 0.57s; }
        .gallery-item:nth-child(20) { animation-delay: 0.60s; }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .gallery-item:hover {
            transform: translateY(-8px);
            border-color: rgba(0, 210, 255, 0.3);
            box-shadow: 0 15px 40px rgba(0, 210, 255, 0.08);
            background: rgba(255,255,255,0.08);
        }

        .gallery-item img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            border-radius: 12px;
            display: block;
            transition: transform 0.3s ease;
        }

        .gallery-item:hover img {
            transform: scale(1.02);
        }

        .gallery-item .file-name {
            color: #fff;
            font-size: 0.8rem;
            margin: 8px 0 6px;
            opacity: 0.7;
            word-break: break-all;
        }

        .gallery-item .btn-group {
            display: flex;
            gap: 8px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .gallery-item .download-btn {
            display: inline-block;
            background: linear-gradient(135deg, #00d2ff, #3a7bd5);
            color: white;
            padding: 7px 20px;
            border-radius: 30px;
            font-weight: 700;
            font-size: 0.8rem;
            text-decoration: none;
            transition: all 0.3s ease;
            border: none;
            cursor: pointer;
        }

        .gallery-item .download-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 20px rgba(0, 210, 255, 0.3);
        }

        .gallery-item .view-btn {
            display: inline-block;
            background: rgba(255,255,255,0.1);
            color: white;
            padding: 7px 20px;
            border-radius: 30px;
            font-weight: 700;
            font-size: 0.8rem;
            border: 1px solid rgba(255,255,255,0.15);
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .gallery-item .view-btn:hover {
            background: rgba(255,255,255,0.2);
        }

        /* ===== LIGHTBOX MODAL ===== */
        .lightbox {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.92);
            backdrop-filter: blur(15px);
            z-index: 99999;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 30px;
            animation: fadeInOverlay 0.4s ease;
        }

        .lightbox.active {
            display: flex;
        }

        @keyframes fadeInOverlay {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .lightbox .close-lb {
            position: absolute;
            top: 25px;
            right: 35px;
            font-size: 2.8rem;
            color: #ff6b6b;
            cursor: pointer;
            background: none;
            border: none;
            transition: transform 0.3s ease;
            z-index: 10;
        }

        .lightbox .close-lb:hover {
            transform: rotate(90deg);
        }

        .lightbox .lb-content {
            max-width: 90%;
            max-height: 85vh;
            text-align: center;
            position: relative;
        }

        .lightbox .lb-content img {
            max-width: 100%;
            max-height: 75vh;
            border-radius: 16px;
            box-shadow: 0 30px 80px rgba(0,0,0,0.6);
            border: 2px solid rgba(255,255,255,0.05);
        }

        .lightbox .lb-content .lb-info {
            color: #a8d8ea;
            font-size: 0.9rem;
            margin-top: 12px;
            word-break: break-all;
        }

        .lightbox .lb-content .lb-download {
            display: inline-block;
            margin-top: 10px;
            background: linear-gradient(135deg, #ffd700, #f7971e);
            color: #1a1a2e;
            padding: 10px 35px;
            border-radius: 30px;
            font-weight: 700;
            font-size: 1rem;
            text-decoration: none;
            transition: all 0.3s ease;
            border: none;
            cursor: pointer;
        }

        .lightbox .lb-content .lb-download:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 30px rgba(255, 215, 0, 0.3);
        }

        .lightbox .nav-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255,255,255,0.1);
            color: white;
            border: none;
            font-size: 2.5rem;
            padding: 15px 20px;
            cursor: pointer;
            border-radius: 50%;
            transition: all 0.3s ease;
            z-index: 5;
        }

        .lightbox .nav-btn:hover {
            background: rgba(255,255,255,0.2);
        }

        .lightbox .nav-prev {
            left: 20px;
        }

        .lightbox .nav-next {
            right: 20px;
        }

        /* ===== FOOTER ===== */
        .footer {
            text-align: center;
            color: rgba(255,255,255,0.4);
            padding: 30px 0 15px;
            font-size: 0.85rem;
            border-top: 1px solid rgba(255,255,255,0.04);
            margin-top: 25px;
        }

        .footer strong {
            color: #00d2ff;
        }

        /* ===== LOADING ===== */
        .loading {
            text-align: center;
            color: #a8d8ea;
            padding: 50px;
            font-size: 1.2rem;
        }

        .loading .spinner {
            display: inline-block;
            width: 40px;
            height: 40px;
            border: 4px solid rgba(255,255,255,0.1);
            border-top-color: #00d2ff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 15px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .no-results {
            text-align: center;
            color: #a8d8ea;
            padding: 50px;
            font-size: 1.2rem;
            grid-column: 1 / -1;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 768px) {
            .header h1 {
                font-size: 1.8rem;
            }
            .header .logo {
                font-size: 2.8rem;
            }
            .gallery-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 12px;
            }
            .gallery-item img {
                height: 160px;
            }
            .gallery-item {
                padding: 10px;
            }
            .search-bar {
                flex-direction: column;
            }
            .search-bar button {
                padding: 10px;
            }
            .lightbox .nav-btn {
                padding: 10px 14px;
                font-size: 1.5rem;
            }
            .lightbox .nav-prev {
                left: 5px;
            }
            .lightbox .nav-next {
                right: 5px;
            }
            .lightbox .close-lb {
                top: 15px;
                right: 20px;
                font-size: 2rem;
            }
            .header .stats {
                gap: 12px;
            }
            .header .stats span {
                font-size: 0.75rem;
                padding: 4px 12px;
            }
        }

        @media (max-width: 480px) {
            .gallery-grid {
                grid-template-columns: 1fr 1fr;
                gap: 10px;
            }
            .gallery-item img {
                height: 130px;
            }
            .header h1 {
                font-size: 1.4rem;
            }
            .gallery-item .download-btn,
            .gallery-item .view-btn {
                padding: 5px 12px;
                font-size: 0.65rem;
            }
            .lightbox .lb-content img {
                max-height: 60vh;
            }
        }
    </style>
</head>
<body>

    <!-- ===== HEADER ===== -->
    <div class="header">
        <div class="logo">☁️</div>
        <h1>Cloud Storage</h1>
        <div class="sub-title">Build Next Technologies</div>

        <div class="dp-section">
            <img src="https://ansh-buildnextt.github.io/teachers-day/ansh" alt="Ansh" class="dp-img" onerror="this.style.display='none'">
            <span class="dp-name">❤️ Ansh Yadav ❤️</span>
        </div>

        <div class="stats">
            <span>📁 Total Files: <strong id="totalFiles">0</strong></span>
            <span>📅 Updated: <strong id="updateDate">Today</strong></span>
        </div>
    </div>

    <!-- ===== SEARCH BAR ===== -->
    <div class="search-bar">
        <input type="text" id="searchInput" placeholder="🔍 Search files..." onkeyup="searchFiles()">
        <button onclick="searchFiles()">🔍 Search</button>
    </div>

    <!-- ===== GALLERY GRID ===== -->
    <div class="gallery-grid" id="galleryGrid">
        <div class="loading">
            <div class="spinner"></div>
            <p>Loading files...</p>
        </div>
    </div>

    <!-- ===== LIGHTBOX ===== -->
    <div class="lightbox" id="lightbox" onclick="closeLightbox(event)">
        <button class="close-lb" onclick="closeLightbox()">✕</button>
        <button class="nav-btn nav-prev" onclick="prevImage(event)">‹</button>
        <button class="nav-btn nav-next" onclick="nextImage(event)">›</button>
        <div class="lb-content" onclick="event.stopPropagation()">
            <img id="lbImage" src="" alt="">
            <div class="lb-info" id="lbInfo">File Name</div>
            <a id="lbDownload" href="#" download class="lb-download">⬇️ Download</a>
        </div>
    </div>

    <!-- ===== FOOTER ===== -->
    <div class="footer">
        © 2026 <strong>Built by Ansh Yadav</strong> | 📞 9305519638 | Build Next Technologies
    </div>

    <script>
        // ===== PHOTOS LIST - APNE PHOTOS KE NAAM YAHAN DAAL =====
        const photoNames = [
            "20260905_123622_f526768.jpg",
            "20260905_123626_efc883f.jpg",
            "20260905_123628_32a48e8.jpg",
            "20260905_123904_e8ca651.jpg",
            "20260905_123906_b3a18ef.jpg",
            "20260905_123911_5547135.jpg",
            "20260905_123912_1ed66b4.jpg",
            "20260905_130359_73f61aa.jpg",
            "20260905_130401_159ecb9.jpg",
            "20260905_130406_1fedd04.jpg",
            "20260905_130407_78c18ed.jpg",
            "20260905_130506_ad5a0b4.jpg",
            "20260905_130508_b3ac91c.jpg",
            "20260905_130609_dcd1935.jpg",
            "20260905_130612_d27a13a.jpg",
            "20260905_130616_0ae5fe2.jpg",
            "20260905_130618_84a956a.jpg",
            "20260905_130652_5e82d5b.jpg",
            "20260905_130654_30638e2.jpg",
            "20260905_130842_2e98ea9.jpg",
            "20260905_130845_50182a5.jpg",
            "20260905_130854_c12f608.jpg",
            "20260905_130856_c842e99.jpg",
            "20260905_130900_fbc154e.jpg",
            "20260905_130913_cb05cf2.jpg",
            "20260905_131655_6a5e5bc.jpg",
            "20260905_131657_b514203.jpg",
            "20260905_131701_aefcf59.jpg",
            "20260905_131703_a98128b.jpg",
            "20260905_131713_e94f421.jpg",
            "20260905_131714_214868b.jpg",
            "20260905_131727_63f5462.jpg",
            "20260905_131729_1756e94.jpg",
            "20260905_131912_17e9329.jpg",
            "20260905_131913_bf02608.jpg",
            "20260905_131917_84544dd.jpg",
            "20260905_131918_048406c.jpg",
            "20260905_131941_a20d6be.jpg",
            "20260905_131943_694dcf6.jpg",
            "20260905_131947_446bcc7.jpg",
            "20260905_133041_d76a907.jpg",
            "20260905_133049_431661d.jpg",
            "20260905_133123_4db4d66.jpg",
            "20260905_133128_c6e56c5.jpg",
            "20260905_133238_3b1cc49.jpg",
            "20260905_133241_9feb27d.jpg",
            "20260905_133242_bc11f37.jpg",
            "20260905_133312_ba399a3.jpg",
            "20260905_133315_21ec7d7.jpg",
            "20260905_133331_0a76040.jpg"
        ];

        // ===== BASE URL =====
        const baseUrl = "https://ansh-buildnextt.github.io/teachers-day/";

        let currentImageIndex = 0;
        let currentFiles = [];

        // ===== RENDER GALLERY =====
        function renderGallery(files) {
            const grid = document.getElementById('galleryGrid');
            grid.innerHTML = '';

            if (files.length === 0) {
                grid.innerHTML = `<div class="no-results">😕 No files found</div>`;
                return;
            }

            files.forEach((file, index) => {
                const item = document.createElement('div');
                item.className = 'gallery-item';
                const imgUrl = baseUrl + file;

                item.innerHTML = `
                    <img src="${imgUrl}" alt="${file}" onclick="openLightbox(${index})" loading="lazy" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22200%22 height=%22200%22%3E%3Crect fill=%22%23333%22 width=%22200%22 height=%22200%22/%3E%3Ctext x=%2250%%22 y=%2250%%22 text-anchor=%22middle%22 dy=%22.3em%22 fill=%22%23aaa%22 font-size=%2220%22 font-family=%22sans-serif%22%3ENo Image%3C/text%3E%3C/svg%3E'">
                    <div class="file-name">${file}</div>
                    <div class="btn-group">
                        <button class="view-btn" onclick="openLightbox(${index})">👁️ View</button>
                        <a href="${imgUrl}" download class="download-btn">⬇️ Download</a>
                    </div>
                `;

                grid.appendChild(item);
            });
        }

        // ===== SEARCH FUNCTION =====
        function searchFiles() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = photoNames.filter(file => file.toLowerCase().includes(query));
            currentFiles = filtered;
            renderGallery(filtered);
            document.getElementById('totalFiles').textContent = filtered.length;
        }

        // ===== LIGHTBOX FUNCTIONS =====
        function openLightbox(index) {
            const files = currentFiles.length > 0 ? currentFiles : photoNames;
            currentImageIndex = index;
            const file = files[index];
            const imgUrl = baseUrl + file;

            document.getElementById('lbImage').src = imgUrl;
            document.getElementById('lbInfo').textContent = file;
            document.getElementById('lbDownload').href = imgUrl;
            document.getElementById('lightbox').classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeLightbox(e) {
            if (e && e.target !== e.currentTarget && !e.target.classList.contains('close-lb')) return;
            document.getElementById('lightbox').classList.remove('active');
            document.body.style.overflow = '';
        }

        function prevImage(e) {
            e.stopPropagation();
            const files = currentFiles.length > 0 ? currentFiles : photoNames;
            currentImageIndex = (currentImageIndex - 1 + files.length) % files.length;
            const file = files[currentImageIndex];
            const imgUrl = baseUrl + file;
            document.getElementById('lbImage').src = imgUrl;
            document.getElementById('lbInfo').textContent = file;
            document.getElementById('lbDownload').href = imgUrl;
        }

        function nextImage(e) {
            e.stopPropagation();
            const files = currentFiles.length > 0 ? currentFiles : photoNames;
            currentImageIndex = (currentImageIndex + 1) % files.length;
            const file = files[currentImageIndex];
            const imgUrl = baseUrl + file;
            document.getElementById('lbImage').src = imgUrl;
            document.getElementById('lbInfo').textContent = file;
            document.getElementById('lbDownload').href = imgUrl;
        }

        // ===== KEYBOARD NAVIGATION =====
        document.addEventListener('keydown', function(e) {
            if (!document.getElementById('lightbox').classList.contains('active')) return;
            if (e.key === 'Escape') closeLightbox();
            if (e.key === 'ArrowLeft') prevImage(e);
            if (e.key === 'ArrowRight') nextImage(e);
        });

        // ===== INIT =====
        currentFiles = photoNames;
        renderGallery(photoNames);
        document.getElementById('totalFiles').textContent = photoNames.length;
        document.getElementById('updateDate').textContent = new Date().toLocaleDateString('en-IN', {
            day: '2-digit',
            month: 'short',
            year: 'numeric'
        });
    </script>

</body>
</html>
