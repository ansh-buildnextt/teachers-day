<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback Admin - Teachers' Day 2026</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            min-height: 100vh;
            padding: 20px;
        }

        .admin-container {
            max-width: 1100px;
            margin: 0 auto;
            background: rgba(255,255,255,0.06);
            backdrop-filter: blur(12px);
            border-radius: 30px;
            padding: 30px 25px;
            border: 1px solid rgba(255,255,255,0.08);
            box-shadow: 0 20px 60px rgba(0,0,0,0.4);
            animation: slideUp 0.6s ease;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .admin-container h1 {
            color: #ffd700;
            font-size: 2.2rem;
            text-align: center;
            margin-bottom: 5px;
        }

        .admin-container .sub-heading {
            color: #a8d8ea;
            text-align: center;
            font-size: 1rem;
            margin-bottom: 20px;
            opacity: 0.8;
        }

        .admin-container .stats {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }

        .admin-container .stats span {
            background: rgba(255,255,255,0.06);
            padding: 8px 25px;
            border-radius: 20px;
            color: #a8d8ea;
            font-size: 0.95rem;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .admin-container .stats span strong {
            color: #ffd700;
        }

        .admin-container .no-feedback {
            text-align: center;
            color: #a8d8ea;
            padding: 40px;
            font-size: 1.1rem;
        }

        .admin-container .feedback-card {
            background: rgba(255,255,255,0.04);
            border-radius: 16px;
            padding: 18px 20px;
            margin-bottom: 15px;
            border-left: 4px solid #ffd700;
            transition: all 0.3s ease;
        }

        .admin-container .feedback-card:hover {
            background: rgba(255,255,255,0.08);
        }

        .admin-container .feedback-card .fb-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            margin-bottom: 8px;
        }

        .admin-container .feedback-card .fb-name {
            color: #ffd700;
            font-weight: 700;
            font-size: 1.1rem;
        }

        .admin-container .feedback-card .fb-teacher {
            color: #a8d8ea;
            font-size: 0.9rem;
        }

        .admin-container .feedback-card .fb-rating {
            color: #ffd700;
            font-size: 1.1rem;
            margin: 4px 0;
        }

        .admin-container .feedback-card .fb-message {
            color: #e0e0e0;
            font-size: 0.95rem;
            line-height: 1.6;
            margin: 6px 0 4px;
        }

        .admin-container .feedback-card .fb-time {
            color: rgba(255,255,255,0.3);
            font-size: 0.75rem;
            margin-top: 6px;
        }

        .admin-container .delete-btn {
            background: rgba(255,107,107,0.15);
            color: #ff6b6b;
            border: 1px solid rgba(255,107,107,0.2);
            padding: 4px 14px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.75rem;
            transition: all 0.3s ease;
        }

        .admin-container .delete-btn:hover {
            background: rgba(255,107,107,0.25);
        }

        .admin-container .export-btn {
            display: inline-block;
            background: linear-gradient(135deg, #00d2ff, #3a7bd5);
            color: white;
            padding: 10px 30px;
            border-radius: 30px;
            font-weight: 700;
            border: none;
            cursor: pointer;
            font-size: 0.95rem;
            transition: all 0.3s ease;
            margin-top: 5px;
        }

        .admin-container .export-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 25px rgba(0, 210, 255, 0.3);
        }

        .admin-container .clear-btn {
            display: inline-block;
            background: rgba(255,107,107,0.15);
            color: #ff6b6b;
            padding: 10px 30px;
            border-radius: 30px;
            font-weight: 700;
            border: 1px solid rgba(255,107,107,0.2);
            cursor: pointer;
            font-size: 0.95rem;
            transition: all 0.3s ease;
            margin-top: 5px;
            margin-left: 10px;
        }

        .admin-container .clear-btn:hover {
            background: rgba(255,107,107,0.25);
        }

        .admin-container .action-btns {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 15px;
        }

        .admin-container .back-link {
            display: inline-block;
            text-align: center;
            color: #a8d8ea;
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.3s ease;
            margin-top: 15px;
        }

        .admin-container .back-link:hover {
            color: #ffd700;
        }

        @media (max-width: 600px) {
            .admin-container {
                padding: 20px 15px;
            }
            .admin-container h1 {
                font-size: 1.6rem;
            }
            .admin-container .feedback-card {
                padding: 14px 15px;
            }
            .admin-container .feedback-card .fb-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 4px;
            }
            .admin-container .stats {
                gap: 12px;
            }
            .admin-container .stats span {
                font-size: 0.8rem;
                padding: 5px 15px;
            }
        }
    </style>
</head>
<body>

    <div class="admin-container">
        <h1>👑 Feedback Admin Panel</h1>
        <p class="sub-heading">Sabhi teachers ke feedback yahan dekhein! ❤️</p>

        <div class="stats">
            <span>📝 Total Feedback: <strong id="totalCount">0</strong></span>
            <span>👥 Unique Teachers: <strong id="teacherCount">0</strong></span>
        </div>

        <div id="feedbackList">
            <div class="no-feedback">⏳ Loading feedback...</div>
        </div>

        <div class="action-btns">
            <button class="export-btn" onclick="exportFeedback()">📥 Export as JSON</button>
            <button class="clear-btn" onclick="clearAllFeedback()">🗑️ Clear All</button>
        </div>

        <a href="https://ansh-buildnextt.github.io/teachers-day/" class="back-link">⬅️ Wapas Home Page par jayein</a>
    </div>

    <script>
        // ===== FEEDBACK DEKHNE KA FUNCTION =====
        function loadFeedback() {
            const list = document.getElementById('feedbackList');
            const totalSpan = document.getElementById('totalCount');
            const teacherSpan = document.getElementById('teacherCount');

            // LocalStorage se data lo
            let allFeedback = JSON.parse(localStorage.getItem('teacherFeedback') || '[]');

            // Update stats
            totalSpan.textContent = allFeedback.length;

            // Unique teachers count
            const uniqueTeachers = new Set(allFeedback.map(fb => fb.teacher));
            teacherSpan.textContent = uniqueTeachers.size;

            if (allFeedback.length === 0) {
                list.innerHTML = `
                    <div class="no-feedback">
                        😕 Abhi tak koi feedback nahi aaya!<br>
                        <span style="font-size:0.9rem;opacity:0.6;">Jab koi feedback dega toh yahan dikhega.</span>
                    </div>
                `;
                return;
            }

            // Reverse order (latest first)
            allFeedback = allFeedback.reverse();

            let html = '';
            allFeedback.forEach((fb, index) => {
                const stars = '⭐'.repeat(parseInt(fb.rating) || 0);
                const time = fb.timestamp || 'Unknown time';

                html += `
                    <div class="feedback-card">
                        <div class="fb-header">
                            <span class="fb-name">${escapeHtml(fb.name)}</span>
                            <span class="fb-teacher">👨‍🏫 ${escapeHtml(fb.teacher)}</span>
                            <button class="delete-btn" onclick="deleteFeedback(${index})">🗑️ Delete</button>
                        </div>
                        <div class="fb-rating">${stars}</div>
                        <div class="fb-message">${escapeHtml(fb.message)}</div>
                        <div class="fb-time">📅 ${escapeHtml(time)}</div>
                    </div>
                `;
            });

            list.innerHTML = html;
        }

        // ===== DELETE SINGLE FEEDBACK =====
        function deleteFeedback(index) {
            if (!confirm('Kya aap yeh feedback delete karna chahte hain?')) return;

            let allFeedback = JSON.parse(localStorage.getItem('teacherFeedback') || '[]');
            // Reverse kyunki humne reverse karke dikhaya tha
            allFeedback = allFeedback.reverse();
            allFeedback.splice(index, 1);
            // Wapas reverse karke save karo
            allFeedback = allFeedback.reverse();
            localStorage.setItem('teacherFeedback', JSON.stringify(allFeedback));
            loadFeedback();
        }

        // ===== CLEAR ALL FEEDBACK =====
        function clearAllFeedback() {
            if (!confirm('⚠️ Kya aap saare feedback delete karna chahte hain? Yeh action wapas nahi ho sakta!')) return;
            if (!confirm('Pakka? 😢')) return;

            localStorage.removeItem('teacherFeedback');
            loadFeedback();
        }

        // ===== EXPORT FEEDBACK AS JSON =====
        function exportFeedback() {
            let allFeedback = JSON.parse(localStorage.getItem('teacherFeedback') || '[]');
            if (allFeedback.length === 0) {
                alert('😕 Koi feedback nahi hai export karne ke liye!');
                return;
            }

            const dataStr = JSON.stringify(allFeedback, null, 2);
            const blob = new Blob([dataStr], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `feedback_${new Date().toISOString().slice(0,10)}.json`;
            a.click();
            URL.revokeObjectURL(url);
        }

        // ===== HTML ESCAPE FUNCTION =====
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // ===== INIT =====
        loadFeedback();

        // Auto-refresh every 30 seconds
        setInterval(loadFeedback, 30000);
    </script>

</body>
</html>
